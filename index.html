<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1420">
  <meta name="description" content="Суфлер для захисту лабораторних з операційних систем. Дії, репліки та команди для показу.">
  <title>Операційні системи · Суфлер для захисту</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script defer src="scenarios.js"></script>
  <script defer src="sufler.js"></script>
</head>
<body>
  <a class="skip" href="#script">До сценарію</a>
  <header class="topbar">
    <div class="bar">
      <div class="brand"><span>Операційні системи</span><small>Суфлер для захисту</small></div>
      <nav id="labs" aria-label="Лабораторні роботи"></nav>
    </div>
    <div class="bar controls">
      <button type="button" id="auto" aria-pressed="false" title="Пробіл — автопрокрутка">▶ Автоскрол</button>
      <label class="speed">Темп <input id="speed" aria-label="Темп прокрутки" type="range" min="1" max="8" value="2"></label>
      <div class="type-controls" aria-label="Розмір тексту">
        <button type="button" id="smaller" aria-label="Зменшити текст">A−</button>
        <button type="button" id="larger" aria-label="Збільшити текст">A+</button>
      </div>
      <button type="button" id="clock" aria-pressed="false" title="Запуск або пауза таймера">00:00</button>
      <button type="button" id="reset">Скинути</button>
    </div>
  </header>

  <main id="script" tabindex="-1">
    <noscript>Увімкни JavaScript, щоб відкрити сценарії.</noscript>
    <div class="intro">
      <div class="kicker" id="topic"></div>
      <h1 id="title"></h1>
      <nav id="steps" class="steps-nav" aria-label="Кроки показу"></nav>
    </div>
    <div class="cards" id="cards"></div>
    <section class="questions" id="questions" aria-label="Контрольні питання"></section>
  </main>

  <footer>
    <div class="foot">
      <button type="button" id="previous">← Назад</button>
      <span id="position" aria-live="polite"></span>
      <button type="button" id="next">Далі →</button>
    </div>
  </footer>
  <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>
</body>
</html>
